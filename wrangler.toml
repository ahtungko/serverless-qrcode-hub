name = "serverless-qrcode-hub"
main = "index.js"
compatibility_date = "2025-03-10"

[[d1_databases]]
binding = "DB"
database_name = "qrcode_hub"
# 注意：将下面的 id 替换为你自己拷贝的 D1 存储的 id 才能正常使用！
database_id = "3cfe51cf-82f6-4e1d-8c2a-459a55645aae"

[triggers]
crons = ["0 2 * * *"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "qrcode_hub_dev"
database_id = "1cfa1ef6-a076-410b-aa19-50f63411313c"

[env.dev.triggers]
crons = ["* * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/admin", "/admin/", "/admin.html", "/login", "/login/", "/login.html"]
